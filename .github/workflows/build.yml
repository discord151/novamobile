name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Vosk model
        run: |
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.4.zip
          unzip -q model.zip
          cp -r vosk-model-small-en-us-0.4/* app/src/main/assets/model-en-us/
          echo 1 > app/src/main/assets/model-en-us/uuid
          rm -f app/src/main/assets/model-en-us/README_PUT_MODEL_HERE.txt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NovaMobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
